<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MLOps Live Inference Audit</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    .nav { background: #fff; border-bottom: 1px solid var(--border); padding: 14px 28px; display: flex; justify-content: space-between; align-items: center; }
    .nav-brand { font-weight: 700; color: var(--primary); text-decoration: none; font-size: 18px; }
    .nav-links a { margin-left: 20px; text-decoration: none; color: #475569; font-size: 14px; font-weight: 500; }
    .nav-links a.active { color: var(--primary); font-weight: 700; }
    .container { max-width: 960px; margin: 30px auto; padding: 0 16px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 28px; margin-bottom: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p.sub { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
    .audit-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .audit-table th, .audit-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; }
    .audit-table th { background: #f1f5f9; color: #334155; }
    .pill { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 700; }
    .pill-elev { background: #fee2e2; color: var(--danger); }
    .pill-mod { background: #fef3c7; color: var(--warning); }
    .pill-low { background: #dcfce7; color: var(--success); }
  </style>
</head>
<body>
  <div class="nav">
    <a href="/" class="nav-brand">CKD Decision Support</a>
    <div class="nav-links">
      <a href="/">Assessment</a>
      <a href="/insights">Model Insights</a>
      <a href="/audit" class="active">MLOps Audit</a>
      <a href="/about">Protocol & Specs</a>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <div>
          <h1>Production Inference Telemetry</h1>
          <p class="sub" style="margin-bottom: 0;">Live transactional record parsed from <code>logs/inference_audit.log</code>.</p>
        </div>
        <button onclick="fetchAuditLogs()" style="background: var(--primary); color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;">Refresh Feed</button>
      </div>

      <table class="audit-table">
        <thead>
          <tr>
            <th>UTC Timestamp</th>
            <th>Patient Age</th>
            <th>Predicted Tier</th>
            <th>Risk Probability</th>
            <th>Latency (ms)</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="logBody">
          <tr><td colspan="6" style="text-align: center; color: var(--muted); padding: 20px;">Loading audit events...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function fetchAuditLogs() {
      try {
        const res = await fetch('/api/audit-logs');
        const logs = await res.json();
        const tbody = document.getElementById('logBody');
        tbody.innerHTML = '';

        if (!logs || logs.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--muted); padding: 20px;">No inference records captured yet. Submit a test case from Assessment!</td></tr>';
          return;
        }

        logs.reverse().forEach(row => {
          let pillClass = 'pill-low';
          if (row.risk_level === 'Elevated Risk') pillClass = 'pill-elev';
          if (row.risk_level === 'Moderate Risk') pillClass = 'pill-mod';

          tbody.innerHTML += `
            <tr>
              <td><code>${row.timestamp.replace('T', ' ').substring(0, 19)}</code></td>
              <td>${row.patient_age} yrs</td>
              <td><span class="pill ${pillClass}">${row.risk_level}</span></td>
              <td><strong>${row.risk_percentage}</strong></td>
              <td>${row.latency_ms} ms</td>
              <td><span style="color: #16a34a; font-weight: 600;">${row.status}</span></td>
            </tr>
          `;
        });
      } catch (err) {
        document.getElementById('logBody').innerHTML = '<tr><td colspan="6" style="text-align: center; color: #dc2626; padding: 20px;">Failed to read logs.</td></tr>';
      }
    }
    fetchAuditLogs();
  </script>
</body>
</html>
